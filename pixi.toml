[workspace]
name = "da-price-forecasting"
version = "0.1.0"
description = "Modular forecasting pipelines for German day-ahead electricity prices."
authors = ["David Eiglsperger"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[environments]
default = ["package", "core"]
core = ["package", "core"]
forecast = ["package", "lear"]
lear = ["package", "lear"]
ops = ["package", "core", "lear"]
dev = ["package", "core", "dev"]

[feature.package.pypi-dependencies]
da-price-forecasting = { path = ".", editable = true }
pyyaml = ">=6.0,<7"

[feature.core.dependencies]
python = "3.11.*"
pip = "*"
numpy = ">=2.4,<2.5"
proj = ">=9,<10"
pyogrio = ">=0.12,<1"
pyproj = ">=3.7,<4"
tectonic = ">=0.16.9,<0.17"

[feature.core.pypi-dependencies]
pydantic = ">=2.11,<3"
python-dotenv = ">=1.0,<2"
requests = ">=2.32,<3"
openpyxl = ">=3.1,<4"
yfinance = ">=0.2,<0.3"
matplotlib = "==3.10.8"
pandas = "==3.0.2"
geopandas = "==1.1.3"
shapely = "==2.1.2"
scikit-learn = "==1.8.0"
scipy = "==1.17.1"
xarray = "==2026.4.0"
cdsapi = ">=0.7.7"
cfgrib = ">=0.9"
pyarrow = ">=19"

[feature.lear.dependencies]
python = "3.11.*"
pip = "*"
llvm-openmp = "*"

[feature.lear.pypi-dependencies]
pydantic = ">=2.11,<3"
python-dotenv = "==1.2.2"
requests = ">=2.32,<3"
entsoe-py = "==0.8.0"
holidays = "==0.95"
openpyxl = ">=3.1,<4"
matplotlib = "==3.10.8"
numpy = "==2.4.4"
pandas = "==3.0.2"
scikit-learn = "==1.8.0"
scipy = "==1.17.1"
statsmodels = "==0.14.6"
lightgbm = ">=4.6,<5"
pyarrow = ">=19"

[feature.dev.dependencies]
python = "3.11.*"
pip = "*"

[feature.dev.pypi-dependencies]
pytest = ">=8,<9"
entsoe-py = "==0.8.0"
holidays = "==0.95"
shap = ">=0.49,<0.50"

[tasks]
da-price-forecast = { cmd = "da-price-forecast", default-environment = "forecast" }
test = { cmd = "pytest", default-environment = "dev" }
