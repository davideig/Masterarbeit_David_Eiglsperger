kind: load_forecast_model
config:
  repo_root: .
  target_tz: Europe/Berlin
  country_code_entsoe: DE_LU
  entsoe_api_key_env: ENTSOE_API_KEY
  entsoe_start_date: '2025-08-01'
  entsoe_end_date: '2026-07-31'
  actual_load_file: data/processed/load_forecast/actual_load.csv
  export_dir: results/load_forecast_results/direct_actual_open_meteo_p10_morning0845_daily_weather_lightgbm_paper_febjul_tw224_f180_pop_weighted_quantiles_clean

  # Direct load model for an earlier 10:30 operational run.
  # It intentionally does not use the ENTSO-E day-ahead load forecast.
  load_target_mode: actual_load
  include_entsoe_forecast_features: false
  include_entsoe_error_lag_features: false
  include_entsoe_error_rolling_features: false

  include_calendar_features: true
  include_holiday_features: true
  include_bridge_day_features: true
  include_actual_load_lag_features: true
  include_partial_load_features: true
  partial_load_reference_day: 1
  partial_load_comparison_lag_days: 7
  partial_load_morning_end_hour: 8
  partial_load_morning_end_minute: 45

  include_weather_features: true
  weather_source: open_meteo
  open_meteo_weather_file: data/processed/open_meteo/open_meteo_icon_d2_single_run06_c25_grid_mean_p10_weather.csv
  open_meteo_cluster_file: data/clustering/icon_d2_clustering_c25.parquet
  open_meteo_base_url: https://customer-single-runs-api.open-meteo.com/v1/forecast
  open_meteo_api_key_env: OPEN_METEO_API_KEY
  open_meteo_api_mode: single_run
  open_meteo_model: icon_d2
  open_meteo_single_run_hour_utc: 06:00
  open_meteo_single_run_forecast_days: 2
  open_meteo_start_date: '2025-09-01'
  open_meteo_end_date: '2026-08-02'
  open_meteo_batch_size: 25
  open_meteo_timeout_seconds: 240
  open_meteo_cell_selection: nearest
  open_meteo_point_selection: grid_mean
  open_meteo_max_points_per_cluster: 10
  open_meteo_request_pause_seconds: 0.5
  open_meteo_retry_attempts: 8
  open_meteo_retry_backoff_seconds: 60.0
  open_meteo_force_download: false
  open_meteo_hourly_variables:
  - wind_speed_80m
  - wind_direction_80m
  - wind_speed_120m
  - wind_direction_120m
  - temperature_2m
  - dew_point_2m
  - surface_pressure
  - shortwave_radiation
  - direct_radiation
  - diffuse_radiation
  - cloud_cover
  - precipitation
  - snow_depth

  include_rich_temperature_features: true
  weather_hdd_thresholds: [12, 15, 18]
  weather_cdd_thresholds: [20, 22, 24]
  include_weighted_weather_features: true
  include_weighted_weather_daily_features: true
  include_weighted_weather_quantile_features: true
  weighted_weather_quantile_feature_bases:
  - solar_global
  - cloud_cover
  - t2m_C
  - hdd12
  - hdd18
  - cdd22
  - cdd24
  - wind_speed_100m
  weighted_weather_quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
  weighted_weather_daily_feature_bases: [t2m_C, hdd12, hdd15, hdd18, cdd20, cdd22, cdd24]
  weighted_weather_daily_stats: [mean, min, max, range]
  weighted_weather_daily_lag_days: [1, 7]
  include_weather_time_interactions: true
  weather_cluster_weight_file: data/processed/load_forecast/weather_cluster_population_weights_c25.csv
  weather_cluster_id_column: cluster_id
  weather_cluster_weight_column: weight
  weather_weighted_feature_prefix: weather_weighted
  weather_weighted_feature_bases: [t2m_C, hdd12, hdd15, hdd18, cdd20, cdd22, cdd24]
  keep_weather_cluster_features: false

  calendar_harmonics: 3
  actual_load_lag_days: [2, 3, 7, 14, 21]
  target_availability_lag_days: 1
  target_availability_cutoff_hour: 8
  target_availability_cutoff_minute: 45
  require_weather_for_training: true

  model_type: lightgbm
  train_days_rolling: 224
  min_train_days: 30
  test_start: '2026-02-01'
  test_end: '2026-07-31'
  lgbm_n_estimators: 900
  lgbm_learning_rate: 0.015
  lgbm_num_leaves: 15
  lgbm_min_child_samples: 80
  lgbm_subsample: 0.9
  lgbm_colsample_bytree: 0.8
  lgbm_reg_lambda: 1.0
  random_state: 42
  max_features: 180

  include_weather_cluster_spread_features: true
  weather_spread_feature_bases:
  - t2m_C
  - hdd12
  - hdd15
  - hdd18
  - cdd20
  - cdd22
  - cdd24
  - rel_humidity_pct
  - vpd_hPa
  - wind_speed_100m
  - cloud_cover
  - solar_global
  - precip
  weather_spread_stats: [range, std, p10, p90]
