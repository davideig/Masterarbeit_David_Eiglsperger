kind: load_forecast_model
config:
  repo_root: "."
  target_tz: Europe/Berlin
  fetch_weather_only: true

  weather_source: open_meteo
  open_meteo_weather_file: data/processed/open_meteo/open_meteo_icon_d2_single_run06_c25_grid_mean_p10_weather.csv
  open_meteo_cluster_file: data/clustering/icon_d2_clustering_c25.parquet
  open_meteo_base_url: https://customer-single-runs-api.open-meteo.com/v1/forecast
  open_meteo_api_key_env: OPEN_METEO_API_KEY
  open_meteo_api_mode: single_run
  open_meteo_model: icon_d2
  open_meteo_single_run_hour_utc: "06:00"
  open_meteo_single_run_forecast_days: 2
  open_meteo_start_date: "2025-09-01"
  open_meteo_end_date: "2026-08-02"

  open_meteo_batch_size: 25
  open_meteo_timeout_seconds: 240
  open_meteo_cell_selection: nearest
  open_meteo_point_selection: grid_mean
  open_meteo_max_points_per_cluster: 10
  open_meteo_request_pause_seconds: 0.5
  open_meteo_retry_attempts: 8
  open_meteo_retry_backoff_seconds: 60.0
  open_meteo_force_download: false
  open_meteo_hourly_variables:
    - wind_speed_80m
    - wind_direction_80m
    - wind_speed_120m
    - wind_direction_120m
    - temperature_2m
    - dew_point_2m
    - surface_pressure
    - shortwave_radiation
    - direct_radiation
    - diffuse_radiation
    - cloud_cover
    - precipitation
    - snow_depth

  export_dir: results/load_forecast_results/load_weather_open_meteo_icon_d2_single_run06_grid_mean_p10_backfill_paper_febjul
